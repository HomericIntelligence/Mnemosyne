name: Validate Plugins

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: '3.13'

      - name: Install dependencies (locked)
        run: uv sync --locked --group dev

      - name: Lint with ruff
        run: uv run ruff check scripts/ tests/

      - name: Validate flat-format skill files
        run: uv run python scripts/validate_plugins.py

      - name: Type check
        run: uv run mypy scripts/ --ignore-missing-imports

      - name: Run test suite
        run: uv run pytest tests/ -v

      - name: Check skill template validity
        run: |
          echo "Checking template structure..."
          if [ ! -f "templates/skill-template.md" ]; then
            echo "ERROR: Template skill-template.md missing"
            exit 1
          fi
          echo "Template structure valid"
