name: Required Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: required-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  forbid-suppressions:
    name: forbid-suppressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: "Reject silent-failure workaround in shell/YAML/Dockerfile/justfile/HCL"
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files \
            -- \
            '*.sh' '*.bash' '*.yml' '*.yaml' '*.hcl' \
            'Dockerfile*' '**/Dockerfile*' \
            'justfile' '**/justfile' 'Justfile' '**/Justfile')
          declare -a scan_files=()
          for f in "${files[@]}"; do
            case "$f" in
              # Exempt this workflow file (heredoc would otherwise self-match)
              .github/workflows/_required.yml) continue ;;
              # Exempt any runbook that documents the rule (if present)
              docs/runbooks/no-silent-failures.md) continue ;;
            esac
            scan_files+=("$f")
          done
          if [ "${#scan_files[@]}" -eq 0 ]; then
            echo "No files to scan"
            exit 0
          fi
          if grep -nE '\|\|[[:space:]]*true([[:space:]]*$|[[:space:]]+#)' "${scan_files[@]}"; then
            echo ""
            echo '::error::Found silent-failure workarounds above. Refactor per HomericIntelligence/Odysseus#280.'
            exit 1
          fi
          echo 'OK: no silent-failure workarounds found'

      - name: "Reject continue-on-error workflow opt-out"
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No workflow files"
            exit 0
          fi
          if grep -nE '^[[:space:]]*continue-on-error:[[:space:]]*true[[:space:]]*$' "${files[@]}"; then
            echo ""
            msg='Found "continue-on-error: true" above. Fix root cause per HomericIntelligence/Odysseus#280.'
            echo "::error::${msg}"
            exit 1
          fi
          echo 'OK: no "continue-on-error: true" found'

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-mnemosyne-${{ runner.os }}-${{ hashFiles('uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-mnemosyne-${{ runner.os }}-
      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t mnemosyne-ci:local .
      - name: yamllint on workflow YAML (in container)
        run: >
          podman run --rm -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000
          mnemosyne-ci:local uv run yamllint -c .yamllint.yaml .github/workflows/
      - name: Run mypy (in container)
        run: |
          podman run --rm -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000 \
            mnemosyne-ci:local bash -c '
            if [ -d scripts ] || [ -d tests ]; then
              uv run python -m mypy
            else
              echo "No scripts/ or tests/ directory — skipping mypy"
            fi
          '
      - name: Run direct PII pattern check (in container)
        run: >
          podman run --rm -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000
          mnemosyne-ci:local uv run python scripts/check_pii.py

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v20.0.0
        with:
          globs: |
            **/*.md
            !.claude/**
          config: ".markdownlint.yaml"

  # NOTE: The check-run name stays `pixi-check` on purpose (ADR-017 uv migration).
  # It is a REQUIRED status context in the live `homeric-main-extras` ruleset
  # (id 18221133), and the merge-queue readiness contract in
  # configs/github/merge-queue-policy.json + docs/ci/merge-queue.md pins that exact
  # name. Renaming the check-run would deadlock the merge queue until an Odysseus
  # operator (issue #386) re-points the ruleset. So the NAME is held stable while
  # the body is migrated from `pixi install --locked` to `uv sync --locked`.
  # Renaming to `uv-check` is a follow-up that must be coordinated with the ruleset.
  pixi-check:
    name: pixi-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-mnemosyne-${{ runner.os }}-${{ hashFiles('uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-mnemosyne-${{ runner.os }}-
      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t mnemosyne-ci:local .
      - name: Verify locked environment runs the test suite (in container)
        run: >
          podman run --rm -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000
          mnemosyne-ci:local uv run python -m pytest tests/ -q

  justfile-check:
    name: justfile-check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Skip if no justfile
        id: detect
        run: |
          if [ ! -f justfile ] && [ ! -f Justfile ]; then
            echo "::notice::No justfile in repo, skipping justfile-check"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install just
        if: steps.detect.outputs.skip == 'false'
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          just-version: "1.36.0"
      - name: Validate justfile
        if: steps.detect.outputs.skip == 'false'
        run: |
          just --evaluate >/dev/null
          just --list >/dev/null

  symlink-check:
    name: symlink-check
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run symlink check
        run: bash scripts/check-symlinks.sh

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-mnemosyne-${{ runner.os }}-${{ hashFiles('uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-mnemosyne-${{ runner.os }}-
      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t mnemosyne-ci:local .
      - name: Run skill-file validation script (in container)
        env:
          MNEMOSYNE_SKILL_SIZE_BASE_REF: >-
            ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
        run: >
          podman run --rm -e MNEMOSYNE_SKILL_SIZE_BASE_REF -v "$PWD:/workspace:Z"
          --userns=keep-id:uid=1000,gid=1000
          mnemosyne-ci:local uv run python scripts/validate_plugins.py
      - name: Run test suite (in container)
        run: >
          podman run --rm -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000
          mnemosyne-ci:local uv run pytest tests/ -v

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-mnemosyne-${{ runner.os }}-${{ hashFiles('uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-mnemosyne-${{ runner.os }}-
      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t mnemosyne-ci:local .
      - name: Validate every skill file across the corpus (in container)
        env:
          MNEMOSYNE_SKILL_SIZE_BASE_REF: >-
            ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
        run: >
          podman run --rm -e MNEMOSYNE_SKILL_SIZE_BASE_REF -v "$PWD:/workspace:Z"
          --userns=keep-id:uid=1000,gid=1000
          mnemosyne-ci:local uv run python scripts/validate_plugins.py
      - name: Assert the skills corpus is non-empty
        run: |
          count=$(find skills -name "*.md" -not -name "*.notes.md" | wc -l)
          echo "Skill files: $count"
          [ "$count" -gt 0 ] || { echo "No skill files found"; exit 1; }

  # Canonical aggregate test gate (ci-naming-convention.md). Surfaces a single
  # `test` check-run that fails if either split suite fails. The split
  # unit-tests / integration-tests sub-checks are KEPT.
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [unit-tests, integration-tests]
    steps:
      - name: Aggregate test result
        run: echo "All test suites (unit-tests, integration-tests) passed."

  security-dependency-scan:
    name: security/dependency-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-mnemosyne-${{ runner.os }}-${{ hashFiles('uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-mnemosyne-${{ runner.os }}-
      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t mnemosyne-ci:local .
      - name: Run pip-audit against the locked runtime dependencies (in container)
        run: |
          podman run --rm -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000 \
            mnemosyne-ci:local bash -c '
            uv export --frozen --no-dev --no-emit-project --format requirements-txt > audit-requirements.txt
            uvx pip-audit --requirement audit-requirements.txt
          '

  security-secrets-scan:
    name: security/secrets-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Full history checkout so gitleaks can scan all commits, not just HEAD.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        env:
          GITLEAKS_IMAGE: >-
            ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
        run: >-
          podman run --rm -v "$PWD:/repo:ro" -w /repo "$GITLEAKS_IMAGE"
          detect --source=. --verbose --exit-code=1

      - name: Upload Gitleaks SARIF
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 90

  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Count skill files
        run: |
          count=$(find . -name "*.md" -path "*/skills/*" | wc -l)
          echo "Total skill files: $count"
          [ "$count" -gt 0 ] || { echo "No skill files found"; exit 1; }
      - name: Validate all JSON files are parseable
        run: |
          find . -name "*.json" -not -path "*/.git/*" | while read f; do
            jq . "$f" > /dev/null || { echo "Invalid JSON: $f"; exit 1; }
          done
          echo "All JSON files valid"

  package:
    name: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-mnemosyne-${{ runner.os }}-${{ hashFiles('uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-mnemosyne-${{ runner.os }}-
      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t mnemosyne-ci:local .
      - name: Build sdist and wheel (in container)
        run: >
          podman run --rm -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000
          mnemosyne-ci:local uv build
      - name: twine check (in container)
        run: >
          podman run --rm -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000
          mnemosyne-ci:local uvx twine check dist/*
      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  install:
    name: install
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: package
    permissions:
      contents: read
    steps:
      # Deliberately NO checkout: the smoke test must import the installed
      # wheel, and an absent repo tree guarantees `mnemosyne_skill_utils` cannot be
      # satisfied from the checkout's scripts/ directory.
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: '3.13'
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Install the wheel into a clean virtualenv
        run: |
          set -euo pipefail
          uv venv "$RUNNER_TEMP/mnemosyne-venv"
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/mnemosyne-venv/bin/activate"
          wheel=$(ls dist/*.whl)
          uv pip install --quiet "$wheel"
      - name: Import-smoke the installed package
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/mnemosyne-venv/bin/activate"
          python - <<'PY'
          import inspect
          import mnemosyne_skill_utils
          src = inspect.getsourcefile(mnemosyne_skill_utils)
          assert "site-packages" in src, f"imported from checkout, not wheel: {src}"
          fm, body, errs = mnemosyne_skill_utils.parse_frontmatter("---\nname: smoke\n---\nbody\n")
          assert fm["name"] == "smoke" and not errs, (fm, errs)
          print("OK: installed wheel imports and parses frontmatter:", src)
          PY

  schema-validation:
    name: schema-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-mnemosyne-${{ runner.os }}-${{ hashFiles('uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-mnemosyne-${{ runner.os }}-
      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t mnemosyne-ci:local .
      - name: Validate workflow YAML files against GitHub schema (in container)
        run: >
          podman run --rm -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000
          mnemosyne-ci:local uvx check-jsonschema
          --builtin-schema vendor.github-workflows
          .github/workflows/*.yml

  deps-version-sync:
    name: deps/version-sync
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-mnemosyne-${{ runner.os }}-${{ hashFiles('uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-mnemosyne-${{ runner.os }}-
      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t mnemosyne-ci:local .
      - name: Assert every skill declares a valid semver version (in container)
        env:
          MNEMOSYNE_SKILL_SIZE_BASE_REF: >-
            ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
        run: >
          podman run --rm -e MNEMOSYNE_SKILL_SIZE_BASE_REF -v "$PWD:/workspace:Z"
          --userns=keep-id:uid=1000,gid=1000
          mnemosyne-ci:local uv run python scripts/validate_plugins.py
      - name: Cross-check pyproject version is valid semver (in container)
        run: |
          podman run --rm -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000 \
            mnemosyne-ci:local bash -c '
            ver=$(uv run python -c '\''import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'\'')
            echo "pyproject version: $ver"
            printf "%s" "$ver" | grep -qE '\''^[0-9]+\.[0-9]+\.[0-9]+$'\'' \
              || { echo "::error::pyproject version is not semver: $ver"; exit 1; }
          '

  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-mnemosyne-${{ runner.os }}-${{ hashFiles('uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-mnemosyne-${{ runner.os }}-
      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t mnemosyne-ci:local .
      - name: Validate release contract (dry-run, in container)
        run: >
          podman run --rm -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000
          mnemosyne-ci:local uv run python scripts/validate_release_contract.py
